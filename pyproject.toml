[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-latchmoe-cuda"
version = "0.1.0"
description = "CUDA LatchMoE expert offloading plugin for vLLM 0.19.1"
requires-python = ">=3.10,<3.14"
license = "Apache-2.0"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "cuda: requires an available CUDA device",
  "real_model: loads weights from the real Qwen checkpoint",
  "e2e: launches a vLLM end-to-end correctness run",
]

